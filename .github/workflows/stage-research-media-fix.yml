name: Stage research navigation and S4NDBOX media repair
on:
  push:
    branches: [stage-research-media-fix-20261014]
    paths:
      - .github/workflows/stage-research-media-fix.yml
      - stage-site-media-edit.py
      - scripts/test-sandbox-media.py
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-research-media-fix-20261014
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm restoration only adds missing original assets
        run: |
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          base='ece508b7f5b818e0716e964e1aa8ffd23793e541'
          changes=subprocess.check_output(['git','diff','--name-status',base,'HEAD','--','projects/sandbox/static'],text=True).splitlines()
          assert changes and all(line.startswith('A\t') for line in changes), changes[:20]
          old=subprocess.check_output(['git','rev-parse','0ac8073ef92ce5f84828f8a9f4a4c3e398f55793:projects/sandbox/static'],text=True).strip()
          now=subprocess.check_output(['git','rev-parse','HEAD:projects/sandbox/static'],text=True).strip()
          assert old==now
          Path('personal-site-qa').mkdir(exist_ok=True)
          Path('personal-site-qa/restored-assets.json').write_text(json.dumps({'source_commit':'0ac8073ef92ce5f84828f8a9f4a4c3e398f55793','static_tree':now,'restored_files':len(changes),'existing_files_unchanged':True,'restored_paths':[x[2:] for x in changes]},indent=2))
          print('Restored',len(changes),'original files; no existing asset was changed.')
          PY
      - name: Apply narrowly scoped website edits
        run: |
          python stage-site-media-edit.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'scripts/build-personal-site.py':'40b213149fa4d4679bfc3c122a34d237d4637f3f',
            'scripts/test-personal-site.py':'49af043c79b0719b324643fab484089db0139ec6',
            'scripts/test-sandbox-media.py':'c044ad622757cbcd182df38308a271c2d5610f3d',
            'assets/js/site-pages.js':'b28d40b00ac4fd30e47005e2eeb6d3423fa165d1',
            'assets/css/site-pages.css':'637747e91b81fdb68ed43baf49d57aaceaab278e',
            '_site_content/site-presentation.json':'850388dd8b68490bbcd504b6cf37e13853bbfd29',
            '_site_content/README.md':'6b7490d67dae9643bd83723fd66401c811777713',
          }
          for n,h in expected.items():
            b=Path(n).read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==h,n
          PY
      - name: Install Chromium and test dependencies
        run: |
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Build and validate pages, inline video and six interactive cases
        run: |
          python scripts/build-personal-site.py
          python scripts/test-personal-site.py
          git diff --check
      - name: Save source and previews for review
        if: always()
        run: |
          mkdir -p media-repair-review/site/assets/css media-repair-review/site/assets/js media-repair-review/source
          cp index.html about.html resume.html research.html publications.html media-repair-review/site/
          cp assets/css/site-pages.css assets/css/research-overview.css media-repair-review/site/assets/css/
          cp assets/js/site-pages.js media-repair-review/site/assets/js/
          cp -R _site_content media-repair-review/source/
          cp scripts/build-personal-site.py scripts/test-personal-site.py scripts/test-sandbox-media.py media-repair-review/source/
          if [ -d personal-site-qa ]; then cp -R personal-site-qa media-repair-review/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-media-repair-review
          path: media-repair-review/
          retention-days: 7
      - name: Commit reviewed output on staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-personal-site.py scripts/test-personal-site.py assets/css/site-pages.css assets/js/site-pages.js _site_content index.html about.html resume.html research.html publications.html
          git commit -m 'Validate Research anchor, inline original demo and restored interactive 4D assets'
          git push origin HEAD:stage-research-media-fix-20261014
          git rev-parse HEAD HEAD^{tree}
