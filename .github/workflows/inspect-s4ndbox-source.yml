name: Inspect public S4NDBOX figures
on:
  push:
    branches: [master]
    paths: [.github/workflows/inspect-s4ndbox-source.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read supplied public project figures
        run: |
          mkdir -p figures
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          for name in ('teaser.png', 'method.png'):
              url = 'https://demo1-indol-gamma.vercel.app/static/images/' + name
              with urllib.request.urlopen(url, timeout=30) as r:
                  data = r.read(15_000_000)
              Path('figures', name).write_bytes(data)
              print(name, len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-project-figures
          path: figures/
          retention-days: 1
