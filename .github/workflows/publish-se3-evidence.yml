name: Publish SE3 evidence atlas
on:
  push:
    branches: [master]
    paths:
      - 'se3-evidence/**'
      - '.github/workflows/publish-se3-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  pages-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/builds"
