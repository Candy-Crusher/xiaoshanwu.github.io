name: Stage abstract-grounded S4NDBOX summaries
on:
  push:
    branches: [s4ndbox-tldr-20261010]
    paths:
      - _tldr_stage/update_s4ndbox_tldr.py
      - .github/workflows/stage-s4ndbox-tldr.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply locally compiled and reviewed summaries
        run: python3 _tldr_stage/update_s4ndbox_tldr.py .
      - name: Save staged sources without changing the live branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv.tex cv/2027-internships/*.tex index.html publications.html
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add full website TLDR and compact CV summary from the S4NDBOX abstract'
          git ls-tree HEAD cv.tex cv index.html publications.html
          git push origin HEAD:s4ndbox-tldr-20261010
