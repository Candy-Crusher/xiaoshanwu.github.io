name: Build editorial homepage preview
on:
  push:
    branches: [design-reference-study-20261010]
    paths: [scripts/editorial_redesign_once.py, .github/workflows/editorial-preview-build.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install beautifulsoup4==4.14.3
      - name: Produce static pages and check publication metadata
        run: python scripts/editorial_redesign_once.py
      - name: Commit generated pages to the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html publications.html
          git commit -m 'Generate reviewed editorial homepage and full publication page'
          git push origin HEAD:design-reference-study-20261010
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-reviewed-pages
          path: |
            index.html
            publications.html
            assets/css/editorial.css
            assets/js/editorial.js
          retention-days: 2
