name: Build HD homepage cover
on:
  push:
    branches: [homepage-hd-hero-20261010]
    paths:
      - scripts/prepare_hero_media.py
      - scripts/update_hero_cover.py
      - assets/css/hero-hd.css
      - assets/js/hero-hd.js
      - .github/workflows/build-hero-preview.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0 beautifulsoup4==4.14.3
      - name: Build responsive images and cover markup
        run: |
          python scripts/prepare_hero_media.py
          python scripts/update_hero_cover.py
      - name: Save reviewed preview files on the preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html images/theme/shared-world-*.webp images/theme/shared-world-source.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build responsive high-resolution hero assets and cover markup'
          git push origin HEAD:homepage-hd-hero-20261010
      - uses: actions/upload-artifact@v4
        with:
          name: hd-cover-preview
          path: |
            index.html
            assets/css/hero-hd.css
            assets/js/hero-hd.js
            images/theme/shared-world-*.webp
            images/theme/shared-world-source.json
          retention-days: 2
