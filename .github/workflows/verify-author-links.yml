name: Verify published author links
on:
  workflow_run:
    workflows: [Build four-page personal website]
    types: [completed]
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-published-author-links
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Wait for the matching published stylesheet and author list
        run: |
          python -u - <<'PY'
          from urllib.request import Request, urlopen
          from pathlib import Path
          from bs4 import BeautifulSoup
          import hashlib, time, sys
          sys.path.insert(0, 'scripts')
          from publication_style import VERSION
          base = 'https://candy-crusher.github.io/xiaoshanwu.github.io/'
          def get(path):
              req = Request(base + path + '?author-check=' + str(time.time_ns()), headers={'User-Agent': 'AuthorLinkValidation/1.0', 'Cache-Control': 'no-cache'})
              with urlopen(req, timeout=12) as response:
                  return response.read()
          for attempt in range(18):
              try:
                  doc = BeautifulSoup(get('index.html'), 'html.parser')
                  assert doc.select_one('#publications').get('data-publication-style') == VERSION
                  css = get('assets/css/publications-classic.css')
                  assert hashlib.sha256(css).digest() == hashlib.sha256(Path('assets/css/publications-classic.css').read_bytes()).digest()
                  print('Published author version and stylesheet verified:', VERSION)
                  break
              except Exception as error:
                  print('Waiting for matching publication:', attempt + 1, str(error))
                  time.sleep(10)
          else:
              raise SystemExit('Matching public author styles not observed')
          PY
      - name: Verify the actual desktop and mobile author links
        run: python scripts/test-author-links.py https://candy-crusher.github.io/xiaoshanwu.github.io/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-author-links-review
          path: author-links-review/
          retention-days: 7
