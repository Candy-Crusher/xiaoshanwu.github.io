name: Build CV PDF

on:
  push:
    branches: [master]
    paths:
      - cv.tex
      - .github/workflows/build-cv.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize QR layout
        run: |
          sed -i 's/qrcode\[height=0.83in\]/qrcode[height=0.72in]/' cv.tex
          sed -i 's/\\\\\[-2.5pt\]/\\\\[0.5pt]/' cv.tex

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          work_in_root_file_dir: true

      - name: Publish stable PDF names
        run: |
          cp cv.pdf Xiaoshan_Wu_CV.pdf
          cp cv.pdf ia8eshfzfsvn.pdf

      - name: Commit generated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Build updated CV PDF [skip ci]
          file_pattern: 'Xiaoshan_Wu_CV.pdf ia8eshfzfsvn.pdf'
