name: Verify published Experience update
on:
  push:
    branches: [fix/experience-order-hd-logos]
    paths: [.github/workflows/verify-experience-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check live HTML and both official vector assets
        run: |
          python -m pip install beautifulsoup4
          python -u - <<'PY'
          from urllib.request import Request, urlopen
          from pathlib import Path
          from bs4 import BeautifulSoup
          import hashlib, json, time
          base='https://candy-crusher.github.io/xiaoshanwu.github.io/'
          output=Path('live-experience-review'); output.mkdir()
          expected={'zju':'fa828fa2f07c54c08e061badbb2335c6e93768a1e2775b2ed4461d089cda7e07','uiuc':'52d845d2bd8875782c9d095a74085f3c98e03802b2aa7522e95342be239b9995'}
          def get(path):
              url=base+path+'?experience-check='+str(time.time_ns())
              with urlopen(Request(url,headers={'User-Agent':'ExperiencePublicationCheck/1.0','Cache-Control':'no-cache'}),timeout=15) as response:
                  assert response.status==200
                  return response.read()
          last={}
          for attempt in range(24):
              try:
                  raw=get('index.html'); doc=BeautifulSoup(raw.decode(),'html.parser')
                  order=[e['data-institution'] for e in doc.select('.experience-timeline > li')]
                  assert order==['harvard','hku','zjui'], order
                  assert doc.body.get('data-single-page')=='harvard-first-vector-logos-v1'
                  assert [a['href'] for a in doc.select('.site-nav a')]==['#top','#news','#research','#experience','#awards','#about']
                  assert len(doc.select('.publication-list > li'))==15
                  logos={}
                  for name,digest in expected.items():
                      src=doc.select_one('.logo-'+name)['src']
                      assert src=='assets/institutions/'+name+'.svg'
                      data=get(src)
                      assert hashlib.sha256(data).hexdigest()==digest, name
                      logos[name]={'path':src,'sha256':digest,'bytes':len(data),'verified':True}
                  report={'status':'PASS','url':base+'index.html#experience','order':order,'logos':logos,'same_page_navigation':True,'publications':15}
                  (output/'report.json').write_text(json.dumps(report,indent=2))
                  (output/'index.html').write_bytes(raw)
                  print(json.dumps(report,indent=2)); break
              except Exception as exc:
                  last={'attempt':attempt+1,'error':str(exc)}
                  print(json.dumps(last)); time.sleep(20)
          else:
              raise SystemExit(json.dumps(last))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: published-experience-verification
          path: live-experience-review/
          retention-days: 2
