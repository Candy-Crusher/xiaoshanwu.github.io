name: Render original GaMe figures
on:
  push:
    branches: [master]
    paths:
      - projects/game/assets/teaser.pdf
      - projects/game/assets/method.pdf
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: research-project-pages-master
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow pymupdf beautifulsoup4
      - name: Render the original committed PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          import fitz
          from PIL import Image
          folder=Path('projects/game/assets');report=[]
          for name in ['teaser.pdf','method.pdf']:
              path=folder/name;raw=path.read_bytes()
              with fitz.open(path) as d:
                  if len(d)!=1:raise ValueError('Expected a single-page project figure')
                  page=d[0];pix=page.get_pixmap(matrix=fitz.Matrix(3600/page.rect.width,3600/page.rect.width),alpha=False)
                  image=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
                  image.save(folder/(path.stem+'-hd.webp'),'WEBP',quality=96,method=6)
                  small=image.resize((1440,round(image.height*1440/image.width)),Image.Resampling.LANCZOS)
                  small.save(folder/(path.stem+'.webp'),'WEBP',quality=96,method=6)
                  report.append({'source_file':name,'sha256':hashlib.sha256(raw).hexdigest(),'pixels':list(image.size),'vector_paths':len(page.get_drawings())})
          (folder/'sources.json').write_text(json.dumps({'source':'Selected GaMe project figure PDFs. No full manuscript or author notes are included.','figures':report},indent=2))
          PY
          python scripts/finalize-project-pages.py
      - name: Commit figure renders and refresh Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects index.html publications.html
          if ! git diff --cached --quiet; then
            git commit -m "Render updated original GaMe project figures"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/builds"
