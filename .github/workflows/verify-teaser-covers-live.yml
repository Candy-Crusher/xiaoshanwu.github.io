name: Verify published teaser covers
on:
  push:
    branches: [teaser-covers-20261015]
    paths: [.github/workflows/verify-teaser-covers-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed1bbb5ca3fec668e8e60efd20443eda27cfdb42
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Verify live HTML and published image hashes
        run: |
          python -u - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,hashlib,time
          base='https://candy-crusher.github.io/xiaoshanwu.github.io/'
          covers=json.loads(Path('_site_content/project-covers.json').read_text())['covers']
          def get(path):
              with urlopen(Request(base+path+'?cover-check='+str(time.time_ns()),headers={'User-Agent':'ProjectCoverValidation/1.0','Cache-Control':'no-cache'}),timeout=15) as r:
                  assert r.status==200
                  return r.read()
          for attempt in range(24):
              try:
                  doc=BeautifulSoup(get('index.html'),'html.parser')
                  assert doc.body.get('data-single-page')=='teaser-covers-20261015-v1','Waiting for current HTML'
                  for key,m in covers.items():
                      image=doc.select_one('#'+key+' .research-media img')
                      assert image and image['src']==m['src'],key
                      assert hashlib.sha256(get(m['src'])).hexdigest()==m['sha256'],key
                  project=BeautifulSoup(get('projects/evsplat/'),'html.parser')
                  assert project.select_one('#evsplat-method-figure img[src="assets/method.png"]')
                  Path('cover-review').mkdir(exist_ok=True)
                  Path('cover-review/live-assets.json').write_text(json.dumps({'status':'PASS','covers':covers,'evsplat_hero':True},indent=2))
                  print('PASS: live page, six cover assets and EVSplat hero');break
              except Exception as exc:
                  print(attempt+1,str(exc));time.sleep(10)
          else:raise SystemExit('Published cover verification failed')
          PY
      - name: Check the actual public pages in desktop and mobile browsers
        run: python scripts/test-project-covers.py https://candy-crusher.github.io/xiaoshanwu.github.io/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-teaser-covers-review
          path: cover-review/
          retention-days: 7
