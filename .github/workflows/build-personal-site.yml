name: Build four-page personal website
on:
  push:
    branches: [master]
    paths:
      - scripts/build-personal-site.py
      - scripts/personal_site_core.py
      - scripts/test-personal-site.py
      - scripts/fetch-institution-icons.py
      - assets/css/single-page.css
      - assets/js/site-pages.js
      - _site_content/**
      - .github/workflows/build-personal-site.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Build research project pages, Mirror original project sites, Render original GaMe figures]
    types: [completed]
    branches: [master]
permissions:
  contents: write
  pages: write
concurrency:
  group: research-project-pages-master
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser-test dependencies
        run: |
          python -m pip install beautifulsoup4 playwright Pillow
          python -m playwright install --with-deps chromium
      - name: Cache institution website icons
        run: python scripts/fetch-institution-icons.py
      - name: Build single-page homepage and legacy fallbacks
        run: |
          sha256sum Xiaoshan_Wu_CV.pdf cv.tex > /tmp/original-cv.sha256
          python -m py_compile scripts/build-personal-site.py scripts/personal_site_core.py scripts/test-personal-site.py
          python scripts/build-personal-site.py
          sha256sum --check /tmp/original-cv.sha256
      - name: Check native navigation, chronology, research and responsive layout
        run: python scripts/test-personal-site.py
      - name: Preserve original video and all interactive 4D cases
        run: python scripts/test-sandbox-media.py
      - name: Check that regeneration is repeatable
        run: |
          sha256sum index.html about.html resume.html research.html publications.html > /tmp/site-first-build.sha256
          python scripts/build-personal-site.py
          sha256sum --check /tmp/site-first-build.sha256
      - name: Save generated pages and visual checks
        if: always()
        run: |
          mkdir -p personal-site-review/site/assets personal-site-review/source/scripts
          for file in index.html about.html resume.html research.html publications.html; do
            if [ -f "$file" ]; then cp "$file" personal-site-review/site/; fi
          done
          for folder in css js institutions; do
            if [ -d assets/$folder ]; then cp -R assets/$folder personal-site-review/site/assets/; fi
          done
          if [ -d _site_content ]; then cp -R _site_content personal-site-review/source/; fi
          cp scripts/build-personal-site.py scripts/personal_site_core.py scripts/test-personal-site.py personal-site-review/source/scripts/
          if [ -d personal-site-qa ]; then cp -R personal-site-qa personal-site-review/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-page-website-review
          path: personal-site-review/
          retention-days: 7
      - name: Commit validated homepage and compatibility pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html resume.html research.html publications.html _site_content assets/institutions
          if ! git diff --cached --quiet; then
            git commit -m "Publish single-page homepage with chronological education and research timeline"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Publish through the existing GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify the public single-page homepage and compatibility pages
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from bs4 import BeautifulSoup
          from pathlib import Path
          import time,json
          config=json.loads(Path('_site_content/site-presentation.json').read_text())
          expected_nav=[item['label'] for item in config['navigation']]
          base='https://candy-crusher.github.io/xiaoshanwu.github.io/'
          for attempt in range(42):
              reports=[]
              for name in ['index.html','about.html','resume.html','research.html','publications.html']:
                  try:
                      url=base+name+'?layout-check='+str(int(time.time()))
                      with urlopen(Request(url,headers={'User-Agent':'PersonalSiteValidation/1.0'}),timeout=12) as response:
                          doc=BeautifulSoup(response.read().decode(),'html.parser');status=response.status
                      nav=doc.select('.site-nav a')
                      labels=[a.get_text(strip=True) for a in nav]
                      prefix='' if name=='index.html' else 'index.html'
                      expected_links=[prefix+'#'+s for s in ['top','news','research','experience','awards','about']]
                      ok=doc.body.get('data-single-page')==config['layout'] and labels==expected_nav and [a['href'] for a in nav]==expected_links
                      ok=ok and doc.select_one('.wordmark').get_text()=="Xiaoshan's Homepage"
                      if name=='index.html':
                          ok=ok and len(doc.select('.timeline-entry'))==3 and len(doc.select('.publication-list>li'))==15 and doc.select_one('#about') is not None
                      reports.append({'page':name,'status':status,'navigation':labels,'updated':bool(ok)})
                  except Exception as exc:reports.append({'page':name,'error':str(exc)})
              if all(r.get('updated') for r in reports):
                  print(json.dumps({'live_pages':reports,'status':'PASS'},indent=2));break
              time.sleep(5)
          else:raise SystemExit(json.dumps({'live_verification':'Updated pages not yet observed','last_checks':reports},indent=2))
          PY
